# Keep this file small: Kitty already has good defaults.
font_family monospace
font_size 11.5

term xterm-kitty
# Run the Zsh configuration without changing the account's login shell.
shell /usr/bin/zsh -l
editor nvim
shell_integration enabled

scrollback_lines 20000
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
wheel_scroll_multiplier 3.0

window_padding_width 6
remember_window_size yes
confirm_os_window_close 1

cursor_shape block
cursor_blink_interval 0
url_style curly
open_url_with default

map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+h show_scrollback
map ctrl+shift+g show_last_command_output
map ctrl+shift+f2 edit_config_file
map ctrl+shift+f5 load_config_file

# Put host- or display-specific choices in ~/.config/kitty/local.conf.
globinclude local.conf
