# All blocks use the dotfiles helper, not distro-provided scripts.
command=~/.local/libexec/dotfiles/i3block $BLOCK_NAME
separator_block_width=15
markup=none

[volume]
interval=3

[memory]
interval=30

[disk]
interval=60

[load]
interval=15

[battery]
interval=30

[network]
interval=30

[time]
interval=1
