# Window behavior recovered from the 2023 i3 configuration.
# Route preferred desktop applications to their original workspaces.
assign [class="^Thunderbird$"] $ws9
assign [class="^Rhythmbox$"] $ws10
assign [class="^Atril$"] $ws3

# Keep dialogs and progress windows floating.
for_window [window_type="dialog"] floating enable
for_window [window_role="pop-up"] floating enable
for_window [window_role="task_dialog"] floating enable
for_window [title="^File Operation Progress$"] floating enable
for_window [title="^Current Media Information$"] floating enable

# Small utilities and desktop preferences.
for_window [class="(?i)^pavucontrol$"] floating enable
for_window [class="(?i)^nm-connection-editor$"] floating enable
for_window [class="(?i)^blueman-manager$"] floating enable
for_window [class="(?i)^galculator$"] floating enable
for_window [class="(?i)^qalculate-gtk$"] floating enable
for_window [class="(?i)^gparted$"] floating enable
for_window [class="(?i)^gnome-system-monitor$"] floating enable
for_window [class="(?i)^simple-scan$"] floating enable
for_window [class="(?i)^system-config-printer.py$"] floating enable
for_window [class="(?i)^lightdm-gtk-greeter-settings$"] floating enable
for_window [class="(?i)^lxappearance$"] floating enable
for_window [class="(?i)^qt5ct$"] floating enable
for_window [class="(?i)^xfburn$"] floating enable
for_window [class="(?i)^engrampa$"] floating enable
for_window [class="(?i)^yad$"] floating enable
for_window [class="(?i)^xpad$"] floating enable
for_window [class="(?i)^xfce4-appfinder$"] floating enable
for_window [class="(?i)^xfrun4$"] floating enable

# Media and messaging were floated in the original configuration.
for_window [class="(?i)^(vlc|mpv|ffplay)$"] floating enable
for_window [class="^TelegramDesktop$"] floating enable border normal
for_window [class="^i3_help$"] floating enable sticky enable border normal

# Notifications must not take keyboard focus.
no_focus [class="^Xfce4-notifyd$"]
